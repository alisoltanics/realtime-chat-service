server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single page app: every unknown path falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The API base URL is inlined at build time (VITE_API_BASE_URL), so no
    # runtime proxy is needed. /healthz is only used by the container healthcheck.
    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok"}';
    }

    location ~* \.(js|css|woff2?|svg|png|jpg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}